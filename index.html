<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界名著人物关系梳理工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        /* 首页样式 */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .home-page h1 {
            font-size: 36px;
            color: #f5c518;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(245, 197, 24, 0.3);
        }
        .home-page .subtitle {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }
        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: #f5c518;
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.2);
        }
        .search-box input::placeholder {
            color: #666;
        }
        .recommend-title {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }
        .book-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .book-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: #f5c518;
            transform: translateY(-5px);
        }
        .book-card .book-name {
            font-size: 18px;
            color: #f5c518;
            margin-bottom: 8px;
        }
        .book-card .book-author {
            font-size: 13px;
            color: #888;
        }
        
        /* 详情页样式 */
        .detail-page {
            display: none;
            min-height: 100vh;
        }
        .detail-page.active {
            display: block;
        }
        .detail-header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .detail-header h1 {
            font-size: 28px;
            color: #f5c518;
        }
        .detail-header .author {
            color: #888;
            font-size: 14px;
        }
        
        /* Tab 导航 */
        .tab-nav {
            display: flex;
            background: rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 15px 30px;
            background: none;
            border: none;
            color: #888;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: #f5c518;
            border-bottom-color: #f5c518;
        }
        
        /* Tab 内容 */
        .tab-content {
            display: none;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .tab-content.active {
            display: block;
        }
        
        /* 人物关系图 */
        .graph-container {
            display: flex;
            gap: 20px;
        }
        .graph-area {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            overflow: auto;
        }
        .info-panel {
            width: 340px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .info-panel .placeholder {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 40px 0;
        }
        .char-detail { display: none; }
        .char-detail.active { display: block; }
        .char-detail .name { font-size: 22px; color: #f5c518; margin-bottom: 5px; }
        .char-detail .gen { font-size: 12px; color: #888; margin-bottom: 15px; }
        .char-detail .desc { font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .char-detail .relations { font-size: 13px; }
        .char-detail .relations h4 { color: #4a9eff; margin: 10px 0 5px; }
        .char-detail .relations li { margin-left: 15px; margin-bottom: 3px; color: #ccc; }
        
        /* 图例 */
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-line {
            width: 30px;
            height: 3px;
        }
        .legend-line.parent { background: #4a9eff; }
        .legend-line.sibling { background: #4a9eff; background: repeating-linear-gradient(90deg, #4a9eff 0, #4a9eff 5px, transparent 5px, transparent 8px); }
        .legend-line.marriage { background: #ff6b6b; }
        .legend-line.love { background: #ff6b6b; background: repeating-linear-gradient(90deg, #ff6b6b 0, #ff6b6b 3px, transparent 3px, transparent 6px); }
        .legend-line.friend { background: #888; background: repeating-linear-gradient(90deg, #888 0, #888 4px, transparent 4px, transparent 8px); }
        
        /* 概要样式 */
        .summary-content {
            max-width: 800px;
        }
        .summary-content h2 {
            color: #f5c518;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .summary-content h3 {
            color: #4a9eff;
            margin: 20px 0 10px;
            font-size: 18px;
        }
        .summary-content p {
            line-height: 1.8;
            margin-bottom: 15px;
            color: #ccc;
        }
        .summary-content ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }
        .summary-content li {
            line-height: 1.8;
            margin-bottom: 5px;
            color: #ccc;
        }
        
        /* 章节梗概 */
        .chapter-list {
            display: grid;
            gap: 15px;
        }
        .chapter-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chapter-item:hover {
            background: rgba(255,255,255,0.08);
        }
        .chapter-item.expanded {
            background: rgba(255,255,255,0.08);
        }
        .chapter-title {
            font-size: 16px;
            color: #f5c518;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-title .toggle {
            font-size: 20px;
            color: #888;
            transition: transform 0.3s;
        }
        .chapter-item.expanded .toggle {
            transform: rotate(180deg);
        }
        .chapter-summary {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            line-height: 1.8;
            color: #ccc;
        }
        .chapter-item.expanded .chapter-summary {
            display: block;
        }
        
        /* 时间线 */
        .timeline {
            position: relative;
            padding-left: 40px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #f5c518, #4a9eff);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -33px;
            top: 25px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f5c518;
            border: 3px solid #1a1a2e;
        }
        .timeline-item .time {
            font-size: 12px;
            color: #f5c518;
            margin-bottom: 8px;
        }
        .timeline-item .event {
            font-size: 15px;
            color: #fff;
            margin-bottom: 8px;
        }
        .timeline-item .desc {
            font-size: 14px;
            color: #aaa;
            line-height: 1.6;
        }
        
        /* 经典场景 */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .scene-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .scene-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-3px);
        }
        .scene-card .scene-title {
            font-size: 16px;
            color: #f5c518;
            margin-bottom: 10px;
        }
        .scene-card .scene-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }
        
        /* SVG 样式 */
        svg { display: block; margin: 0 auto; }
        .node { cursor: pointer; }
        .node circle {
            stroke: #fff;
            stroke-width: 2;
            transition: all 0.3s;
        }
        .node:hover circle { stroke-width: 3; filter: brightness(1.3); }
        .node.highlighted circle { stroke: #f5c518; stroke-width: 4; filter: drop-shadow(0 0 10px rgba(245,197,24,0.5)); }
        .node text {
            fill: #e0e0e0;
            font-size: 11px;
            text-anchor: middle;
            pointer-events: none;
        }
        .link {
            fill: none;
            stroke-width: 2;
            transition: all 0.3s;
        }
        .link.parent { stroke: #4a9eff; }
        .link.sibling { stroke: #4a9eff; stroke-dasharray: 5,3; }
        .link.marriage { stroke: #ff6b6b; }
        .link.love { stroke: #ff6b6b; stroke-dasharray: 3,3; }
        .link.friend { stroke: #888; stroke-dasharray: 4,4; }
        .link.dimmed { opacity: 0.15; }
        .node.dimmed { opacity: 0.2; }
        .link.highlighted { stroke-width: 3; filter: drop-shadow(0 0 5px currentColor); }
        
        @media (max-width: 1100px) {
            .graph-container { flex-direction: column; }
            .info-panel { width: 100%; max-height: none; }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div class="home-page" id="homePage">
        <h1>📚 世界名著导读</h1>
        <p class="subtitle">人物关系 · 故事概要 · 章节梗概 · 关键时间线</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入小说名称搜索..." autocomplete="off">
        </div>
        
        <p class="recommend-title">📖 热门推荐</p>
        <div class="book-grid" id="bookGrid">
            <div class="book-card" data-book="百年孤独">
                <div class="book-name">百年孤独</div>
                <div class="book-author">加西亚·马尔克斯</div>
            </div>
            <div class="book-card" data-book="飘">
                <div class="book-name">飘</div>
                <div class="book-author">玛格丽特·米切尔</div>
            </div>
            <div class="book-card" data-book="简爱">
                <div class="book-name">简爱</div>
                <div class="book-author">夏洛蒂·勃朗特</div>
            </div>
            <div class="book-card" data-book="茶花女">
                <div class="book-name">茶花女</div>
                <div class="book-author">小仲马</div>
            </div>
            <div class="book-card" data-book="红楼梦">
                <div class="book-name">红楼梦</div>
                <div class="book-author">曹雪芹</div>
            </div>
            <div class="book-card" data-book="战争与和平">
                <div class="book-name">战争与和平</div>
                <div class="book-author">列夫·托尔斯泰</div>
            </div>
        </div>
    </div>
    
    <!-- 详情页 -->
    <div class="detail-page" id="detailPage">
        <div class="detail-header">
            <button class="back-btn" onclick="goHome()">← 返回</button>
            <div>
                <h1 id="bookTitle">百年孤独</h1>
                <span class="author" id="bookAuthor">加西亚·马尔克斯</span>
            </div>
        </div>
        
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="relationship">人物关系</button>
            <button class="tab-btn" data-tab="summary">小说概要</button>
            <button class="tab-btn" data-tab="chapters">章节梗概</button>
            <button class="tab-btn" data-tab="timeline">关键时间线</button>
            <button class="tab-btn" data-tab="scenes">经典场景</button>
            <button class="tab-btn" data-tab="characters">人物详情</button>
        </div>
        
        <!-- 人物关系 Tab -->
        <div class="tab-content active" id="tab-relationship">
            <div class="legend">
                <div class="legend-item"><div class="legend-line parent"></div><span>父母→子女</span></div>
                <div class="legend-item"><div class="legend-line sibling"></div><span>手足/同胞</span></div>
                <div class="legend-item"><div class="legend-line marriage"></div><span>婚姻</span></div>
                <div class="legend-item"><div class="legend-line love"></div><span>爱情/情人</span></div>
                <div class="legend-item"><div class="legend-line friend"></div><span>朋友</span></div>
            </div>
            <div class="graph-container">
                <div class="graph-area">
                    <svg id="graph" width="1200" height="900"></svg>
                </div>
                <div class="info-panel" id="infoPanel">
                    <p class="placeholder" id="placeholder">点击人物节点查看详情</p>
                    <div class="char-detail" id="charDetail"></div>
                </div>
            </div>
        </div>
        
        <!-- 小说概要 Tab -->
        <div class="tab-content" id="tab-summary">
            <div class="summary-content" id="summaryContent"></div>
        </div>
        
        <!-- 章节梗概 Tab -->
        <div class="tab-content" id="tab-chapters">
            <div class="chapter-list" id="chapterList"></div>
        </div>
        
        <!-- 关键时间线 Tab -->
        <div class="tab-content" id="tab-timeline">
            <div class="timeline" id="timelineContent"></div>
        </div>
        
        <!-- 经典场景 Tab -->
        <div class="tab-content" id="tab-scenes">
            <div class="scene-grid" id="sceneGrid"></div>
        </div>
        
        <!-- 人物详情 Tab -->
        <div class="tab-content" id="tab-characters">
            <div class="chapter-list" id="characterList"></div>
        </div>
    </div>

    <script>
        // 小说数据
        const booksData = {
            '百年孤独': {
                author: '加西亚·马尔克斯',
                summary: {
                    intro: '《百年孤独》是哥伦比亚作家加西亚·马尔克斯的代表作，也是拉丁美洲魔幻现实主义文学的代表作。被誉为"再现拉丁美洲历史社会图景的鸿篇巨著"。',
                    theme: '作品描写了布恩迪亚家族七代人的传奇故事，以及加勒比海沿岸小镇马孔多的百年兴衰，反映了拉丁美洲一个世纪以来风云变幻的历史。作品融入神话传说、民间故事、宗教典故等神秘因素，巧妙地糅合了现实与虚幻，展现出一个瑰丽的想象世界。',
                    background: '小说以作者童年时代的外祖父家为原型，融合了哥伦比亚乃至拉丁美洲的历史事件：千日战争、香蕉公司、大屠杀、连绵四年的大雨等。',
                    significance: '1982年，马尔克斯凭借此作获得诺贝尔文学奖。评委称其"把幻想与现实融为一体，勾画出一个丰富多彩的想象中的世界，反映了拉丁美洲大陆的生活和斗争"。'
                },
                chapters: [
                    { title: '第一章：马孔多的建立', summary: '何塞·阿尔卡蒂奥·布恩迪亚和乌尔苏拉这对表兄妹结婚后，因害怕生出长猪尾巴的孩子而离开故乡，带领一群人穿越沼泽，建立了马孔多村。吉普赛人梅尔基亚德斯带来了磁铁、放大镜等"发明"，激发了何塞对炼金术的痴迷。' },
                    { title: '第二章：家族的繁衍', summary: '布恩迪亚家族开始繁衍。长子何塞·阿尔卡蒂奥身材巨大，次子奥雷里亚诺（后来的上校）性格内向。乌尔苏拉通过制作小动物糖果生意兴隆。何塞因痴迷炼金术逐渐疯癫，被绑在栗树下。' },
                    { title: '第三章：内战与上校', summary: '自由派与保守派的内战爆发。奥雷里亚诺·布恩迪亚上校发动32场起义，全部失败。他与多个女人生了17个儿子，最终厌倦战争，回到马孔多制作小金鱼。' },
                    { title: '第四章：香蕉公司', summary: '美国香蕉公司进入马孔多，带来繁荣也带来剥削。工人们举行罢工，政府军队在火车站屠杀3000多人，尸体被运走扔进大海。官方却宣称"没有人死亡"。何塞·阿尔卡蒂奥第二是唯一幸存者。' },
                    { title: '第五章：连绵大雨', summary: '大屠杀后，马孔多下了四年十一个月零两天的雨。布恩迪亚家族开始衰败。奥雷里亚诺第二与情妇佩特拉的牲畜疯狂繁殖，但雨停后一切化为乌有。' },

                timeline: [

                    { title: '娜塔莎的舞会', desc: '娜塔莎在舞会上第一次跳舞，展现了青春的美丽和活力。' },

                ],
                characters: [

                    { id: 'natasha', name: '娜塔莎·罗斯托娃', gen: 1, x: 200, y: 350, color: '#2ecc71', desc: '罗斯托夫伯爵之女，活泼美丽。与安德烈订婚，后与皮埃尔结婚。', relations: [{type:'恋人',target:'安德烈公爵'},{type:'丈夫',target:'皮埃尔'},{type:'父亲',target:'罗斯托夫伯爵'}] },

                    { id: 'helen', name: '海伦·库拉金', gen: 1, x: 600, y: 350, color: '#ff9800', desc: '库拉金之女，美貌但放荡。皮埃尔的第一任妻子。', relations: [{type:'丈夫',target:'皮埃尔'}] },
                    { id: 'maria', name: '玛丽亚·鲍尔康斯卡娅', gen: 1, x: 300, y: 100, color: '#e67e22', desc: '安德烈的妹妹，虔诚善良。与尼古拉结婚。', relations: [{type:'哥哥',target:'安德烈公爵'},{type:'丈夫',target:'尼古拉'}] },
                    { id: 'rostov', name: '罗斯托夫伯爵', gen: 0, x: 100, y: 200, color: '#607d8b', desc: '娜塔莎和尼古拉的父亲，善良但挥霍无度。', relations: [{type:'女儿',target:'娜塔莎'},{type:'儿子',target:'尼古拉'}] },
                ],
                links: [
                    { source: 'rostov', target: 'natasha', type: 'parent' },
                    { source: 'rostov', target: 'nikolai', type: 'parent' },
                    { source: 'natasha', target: 'nikolai', type: 'sibling' },
                    { source: 'pierre', target: 'helen', type: 'marriage' },
                    { source: 'pierre', target: 'natasha', type: 'marriage' },
                    { source: 'andrei', target: 'natasha', type: 'love' },
                    { source: 'andrei', target: 'maria', type: 'sibling' },
                    { source: 'nikolai', target: 'maria', type: 'marriage' },
                    { source: 'pierre', target: 'andrei', type: 'friend' },
                ]
            }
        };
        
        let currentBook = null;
        
        // 首页交互
        document.querySelectorAll('.book-card').forEach(card => {
            card.addEventListener('click', () => {
                const bookName = card.dataset.book;
                if (booksData[bookName]) {
                    openBook(bookName);
                } else {
                    alert(`《${bookName}》的数据正在准备中，敬请期待！`);
                }
            });
        });
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (booksData[query]) {
                    openBook(query);
                } else {
                    alert(`未找到《${query}》，请从推荐列表中选择。`);
                }
            }
        });
        
        function openBook(bookName) {
            currentBook = bookName;
            const book = booksData[bookName];
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').classList.add('active');
            document.getElementById('bookTitle').textContent = bookName;
            document.getElementById('bookAuthor').textContent = book.author;
            
            renderSummary(book.summary);
            renderChapters(book.chapters);
            renderTimeline(book.timeline);
            renderScenes(book.scenes);
            renderCharacters(book.characters);
            renderGraph(book.characters, book.links);
        }
        
        function goHome() {
            document.getElementById('homePage').style.display = 'flex';
            document.getElementById('detailPage').classList.remove('active');
        }
        
        // Tab 切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        
        function renderSummary(summary) {
            document.getElementById('summaryContent').innerHTML = `
                <h2>作品简介</h2>
                <p>${summary.intro}</p>
                <h3>主题思想</h3>
                <p>${summary.theme}</p>
                <h3>创作背景</h3>
                <p>${summary.background}</p>
                <h3>文学价值</h3>
                <p>${summary.significance}</p>
            `;
        }
        
        function renderChapters(chapters) {
            document.getElementById('chapterList').innerHTML = chapters.map((ch, i) => `
                <div class="chapter-item" onclick="this.classList.toggle('expanded')">
                    <div class="chapter-title">
                        <span>${ch.title}</span>
                        <span class="toggle">▼</span>
                    </div>
                    <div class="chapter-summary">${ch.summary}</div>
                </div>
            `).join('');
        }
        
        function renderTimeline(timeline) {
            document.getElementById('timelineContent').innerHTML = timeline.map(item => `
                <div class="timeline-item">
                    <div class="time">${item.time}</div>
                    <div class="event">${item.event}</div>
                    <div class="desc">${item.desc}</div>
                </div>
            `).join('');
        }
        
        function renderScenes(scenes) {
            document.getElementById('sceneGrid').innerHTML = scenes.map(scene => `
                <div class="scene-card">
                    <div class="scene-title">${scene.title}</div>
                    <div class="scene-desc">${scene.desc}</div>
                </div>
            `).join('');
        }
        
        function renderCharacters(characters) {
            document.getElementById('characterList').innerHTML = characters
                .filter(c => c.gen > 0)
                .sort((a, b) => a.gen - b.gen || a.x - b.x)
                .map(char => `
                    <div class="chapter-item" onclick="this.classList.toggle('expanded')">
                        <div class="chapter-title">
                            <span>${char.name} <small style="color:#888">（第${char.gen}代）</small></span>
                            <span class="toggle">▼</span>
                        </div>
                        <div class="chapter-summary">
                            <p style="margin-bottom:10px">${char.desc}</p>
                            <h4 style="color:#4a9eff;margin:10px 0 5px">关系网络</h4>
                            <ul>
                                ${char.relations.map(r => `<li><strong>${r.type}：</strong>${r.target}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
        }
        
        function renderGraph(characters, links) {
            const svg = document.getElementById('graph');
            svg.innerHTML = '';
            
            // 绘制关系线
            links.forEach(link => {
                const source = characters.find(c => c.id === link.source);
                const target = characters.find(c => c.id === link.target);
                if (!source || !target) return;
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const midX = (source.x + target.x) / 2;
                const dy = target.y - source.y;
                
                let d;
                if (Math.abs(dy) > 10) {
                    d = `M ${source.x} ${source.y} C ${midX} ${source.y}, ${midX} ${target.y}, ${target.x} ${target.y}`;
                } else {
                    const arcMap = { 'marriage': -25, 'sibling': -55, 'love': -40, 'parent': -70 };
                    const arcHeight = arcMap[link.type] || -30;
                    d = `M ${source.x} ${source.y} Q ${midX} ${source.y + arcHeight} ${target.x} ${target.y}`;
                }
                
                line.setAttribute('d', d);
                line.setAttribute('class', `link ${link.type}`);
                line.dataset.source = link.source;
                line.dataset.target = link.target;
                svg.appendChild(line);
            });
            
            // 绘制人物节点
            characters.forEach(char => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'node');
                g.dataset.id = char.id;
                
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', char.x);
                circle.setAttribute('cy', char.y);
                circle.setAttribute('r', 20);
                circle.setAttribute('fill', char.color);
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', char.x);
                text.setAttribute('y', char.y + 38);
                text.textContent = char.name;
                
                g.appendChild(circle);
                g.appendChild(text);
                
                g.addEventListener('click', () => selectCharacter(char));
                
                svg.appendChild(g);
            });
        }
        
        function selectCharacter(char) {
            document.querySelectorAll('.node').forEach(n => n.classList.remove('highlighted', 'dimmed'));
            document.querySelectorAll('.link').forEach(l => l.classList.remove('highlighted', 'dimmed'));
            
            const node = document.querySelector(`.node[data-id="${char.id}"]`);
            node.classList.add('highlighted');
            
            const relatedIds = new Set([char.id]);
            document.querySelectorAll('.link').forEach(l => {
                if (l.dataset.source === char.id || l.dataset.target === char.id) {
                    l.classList.add('highlighted');
                    relatedIds.add(l.dataset.source);
                    relatedIds.add(l.dataset.target);
                } else {
                    l.classList.add('dimmed');
                }
            });
            
            document.querySelectorAll('.node').forEach(n => {
                if (!relatedIds.has(n.dataset.id)) {
                    n.classList.add('dimmed');
                }
            });
            
            document.getElementById('placeholder').style.display = 'none';
            const charDetail = document.getElementById('charDetail');
            charDetail.classList.add('active');
            charDetail.innerHTML = `
                <div class="name">${char.name}</div>
                <div class="gen">第${char.gen === 0 ? '外部' : char.gen}代</div>
                <div class="desc">${char.desc}</div>
                <div class="relations">
                    <h4>关系网络</h4>
                    <ul>
                        ${char.relations.map(r => `<li><strong>${r.type}：</strong>${r.target}</li>`).join('')}
                    </ul>
                </div>
            `;
        }
        
        document.getElementById('graph').addEventListener('click', (e) => {
            if (e.target.tagName === 'svg') {
                document.querySelectorAll('.node').forEach(n => n.classList.remove('highlighted', 'dimmed'));
                document.querySelectorAll('.link').forEach(l => l.classList.remove('highlighted', 'dimmed'));
                document.getElementById('placeholder').style.display = 'block';
                document.getElementById('charDetail').classList.remove('active');
            }
        });
    </script>
